function adminBody(){let f=branchFilter==='all'?db.bookings:db.bookings.filter(b=>b.branch===branchFilter);const top=`<div class="dash-top"><div><div class="eyebrow">THE GENT’S · MANAGEMENT</div><h1>${({overview:'Admin Dashboard',bookings:'Bookings',calendar:'Appointment Calendar',branches:'Branches',barbers:'Barbers',services:'Services',clients:'Clients',reports:'Reports & Analytics',settings:'Settings'})[dashboardTab]}</h1><p class="muted">${dashboardTab==='overview'?'Overview of bookings and branch performance.':'Interactive demo · changes are saved in your browser.'}</p></div><select id="admin-branch" class="field" style="width:205px"><option value="all">All Branches</option>${db.branches.map(b=>`<option value="${b.id}" ${branchFilter===b.id?'selected':''}>${esc(b.name)}</option>`).join('')}</select></div>`;
const counts=(s)=>f.filter(x=>x.status===s).length;
if(dashboardTab==='overview')return top+`<div class="stat-grid">${[['▢',f.length,'Total Bookings'],['✓',counts('Confirmed'),'Confirmed'],['◷',counts('Pending'),'Pending'],['×',counts('Cancelled'),'Cancelled']].map(([ico,num,t])=>`<div class="stat"><span class="stat-icon">${ico}</span><div class="number">${num}</div><div class="small">${t}</div></div>`).join('')}</div><div class="panel">${bookingTable(f.slice().reverse().slice(0,7),'Recent Bookings',true)}</div><div class="dash-grid"><div class="panel"><div class="panel-head"><h3>Branch Performance</h3></div>${db.branches.map(x=>{let n=db.bookings.filter(b=>b.branch===x.id).length;return `<div class="progress-row"><span>${esc(x.name)}</span><div class="track"><div class="fill" style="width:${Math.max(3,n/db.bookings.length*100)}%"></div></div><b>${n}</b></div>`}).join('')}</div><div class="panel"><div class="panel-head"><h3>Quick Actions</h3></div><div class="grid grid-3">${button('+ Walk-in','walkin','btn')}${button('+ Branch','add-branch','btn')}${button('Pending','admin-tab:bookings','btn')}</div></div></div>`;
if(dashboardTab==='bookings')return top+`<div class="panel"><div class="panel-head"><h3>All Bookings</h3><div class="auth-actions">${button('+ Walk-in','walkin','btn btn-gold btn-sm')}${button('Reset Demo','reset','btn btn-sm')}</div></div>${bookingTable(f.slice().reverse(),'Booking Requests',false)}</div>`;
if(dashboardTab==='calendar'){let groups=[...new Set(f.map(x=>x.date))].sort();return top+`<div class="panel"><div class="panel-head"><h3>Calendar</h3>${button('+ Walk-in','walkin','btn btn-gold btn-sm')}</div>${groups.map(day=>`<h3 style="font-size:20px;margin:25px 0 12px">${fmt(day)}</h3>${f.filter(b=>b.date===day).sort((a,b)=>a.time.localeCompare(b.time)).map(b=>`<div class="appointment"><div><strong>${esc(b.time)} · ${esc(b.name)}</strong><small>${esc(service(b.service).name)} · ${esc(barber(b.barber).name)} · ${esc(branch(b.branch).name)}</small></div>${badge(b.status)}</div>`).join('')}`).join('')||'<p class="muted">No appointments.</p>'}</div>`}
if(dashboardTab==='branches')return top+`<div class="panel"><div class="panel-head"><h3>Branch Directory</h3>${button('+ Add Branch','add-branch','btn btn-gold btn-sm')}</div><div class="grid grid-3">${db.branches.map(x=>`<div class="card"><img class="branch-photo" src="${x.photo}"><div class="card-pad"><h3>${esc(x.name)}</h3><p class="muted small">${esc(x.place)}<br>${esc(x.hours)}</p>${button('View Page','open-branch:'+x.id,'btn btn-sm')}</div></div>`).join('')}</div></div>`;
if(dashboardTab==='barbers')return top+`<div class="panel"><div class="panel-head"><h3>Team</h3>${button('+ Add Barber','add-barber','btn btn-gold btn-sm')}</div><div class="grid grid-4">${db.barbers.map(barberCard).join('')}</div></div>`;
if(dashboardTab==='services')return top+`<div class="panel"><div class="panel-head"><h3>Services & Prices</h3>${button('+ Add Service','add-service','btn btn-gold btn-sm')}</div>${db.services.map(x=>`<div class="service-row"><span class="service-icon">${x.icon}</span><div class="service-text"><strong>${esc(x.name)}</strong><small>${x.duration} min</small></div><b>${money(x.price)}</b>${button('Edit','edit-service:'+x.id,'btn btn-sm')}</div>`).join('')}</div>`;
if(dashboardTab==='clients'){let clients=[...new Map(db.bookings.map(x=>[x.phone,x])).values()];return top+`<div class="panel"><div class="panel-head"><h3>Customers (${clients.length})</h3></div><div class="table-wrap"><table><thead><tr><th>Name</th><th>Phone</th><th>Email</th><th>Last Booking</th></tr></thead><tbody>${clients.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.phone)}</td><td>${esc(x.email)}</td><td>${fmt(x.date)}</td></tr>`).join('')}</tbody></table></div></div>`}
if(dashboardTab==='reports'){const total=f.length||1;return top+`<div class="stat-grid">${[['◉','1,284','Visitors (sample)'],['↗','3.8%','Booking rate (sample)'],['▢',f.length,'Actual demo bookings'],['✓',counts('Confirmed'),'Confirmed appointments']].map(([i,n,t])=>`<div class="stat"><div class="stat-icon">${i}</div><div class="number">${n}</div><div class="small">${t}</div></div>`).join('')}</div><div class="dash-grid"><div class="panel"><h3>Booking Status</h3>${['Pending','Confirmed','Cancelled','Completed'].map(x=>`<div class="progress-row"><span>${x}</span><div class="track"><div class="fill" style="width:${counts(x)/total*100}%"></div></div><b>${counts(x)}</b></div>`).join('')}</div><div class="panel"><h3>Source Breakdown</h3>${['Online','Walk-in'].map(x=>{let n=f.filter(b=>b.source===x).length;return `<div class="progress-row"><span>${x}</span><div class="track"><div class="fill" style="width:${n/total*100}%"></div></div><b>${n}</b></div>`}).join('')}<p class="small muted">Visitor figures above are illustrative; bookings reflect the interactive demo.</p></div></div>`}
return top+`<div class="panel" style="max-width:620px"><h3>Demo Settings</h3><p class="muted">Theme, sample data and local state controls.</p><div class="auth-actions">${button('Toggle Theme','theme')}${button('Reset Sample Data','reset')}${button('Preview Website','go:home','btn btn-gold')}</div><p class="muted small" style="margin-top:25px">In production, SMTP, WhatsApp Business API, roles and SEO settings would be configured on the PHP/MySQL backend. This prototype makes no network changes.</p></div>`}
function bookingTable(list,title,short){return `${short?`<div class="panel-head"><h3>${title}</h3>${button('View All','admin-tab:bookings','btn btn-sm')}</div>`:''}<div class="table-wrap"><table><thead><tr><th>Time</th><th>Client</th><th>Service</th><th>Barber</th><th>Branch</th><th>Status</th><th>Action</th></tr></thead><tbody>${list.map(b=>`<tr><td>${fmt(b.date)}<br><span class="muted">${esc(b.time)}</span></td><td>${esc(b.name)}</td><td>${esc(service(b.service).name)}</td><td>${esc(barber(b.barber).name)}</td><td>${esc(branch(b.branch).name)}</td><td>${badge(b.status)}</td><td>${b.status==='Pending'?`<div class="row-actions"><button class="btn btn-sm" data-action="approve:${b.id}">✓</button><button class="btn btn-sm" data-action="decline:${b.id}">×</button></div>`:button('View','view-booking:'+b.id,'btn btn-sm')}</td></tr>`).join('')}</tbody></table>${list.length?'':'<div class="empty">No bookings yet.</div>'}</div>`}
function confirmPage(){return `<div class="shell" style="max-width:740px;text-align:center"><div class="section"><div style="display:inline-grid;place-items:center;background:var(--gold-soft);color:var(--gold);width:72px;height:72px;border-radius:50%;font-size:29px;margin-bottom:20px">✓</div><div class="eyebrow">REQUEST SUBMITTED</div><h1>Booking Request Received</h1><p class="muted">Your request has been sent to the branch receptionist for review. This is a demo: notifications are simulated.</p><div class="page-panel" style="margin:25px auto;max-width:540px;text-align:left">${[['Booking reference',booking.id],['Branch',branch(booking.branch).name],['Service',service(booking.service).name],['Date',fmt(booking.date)],['Time',booking.time],['Status','Pending approval']].map(([k,v])=>`<div class="summary-row"><span>${k}</span><strong>${esc(v)}</strong></div>`).join('')}</div>${button('My Bookings','go:client','btn btn-gold')} ${button('Back to Home','go:home')}</div></div>`}
function render(){syncHero();let body;if(page.startsWith('branch:'))body=branchPage(page.slice(7));else body=({home,services,barbers,gallery,membership,contact,booking:bookingPage,client,admin,confirmation:confirmPage})[page]?.()||home();document.getElementById('app').innerHTML=header()+`<div class="page">${body}</div>`+(page==='admin'||page==='client'?'':footer());document.title=`The Gent’s · ${page.charAt(0).toUpperCase()+page.slice(1)} (Demo)`;document.querySelector('meta[name=theme-color]').content=dark?'#111111':'#ffffff';}
function navigate(p){page=p;window.scrollTo({top:0,behavior:'instant'});render()}
function toast(message){document.getElementById('toast-root').innerHTML=`<div class="toast"><b>Demo action</b><br>${esc(message)}</div>`;clearTimeout(toast.timer);toast.timer=setTimeout(()=>document.getElementById('toast-root').innerHTML='',3500)}
function modal(title,content){document.getElementById('modal-root').innerHTML=`<div class="overlay" id="overlay"><div class="modal"><div class="modal-top"><h3>${title}</h3><button data-action="close-modal" class="icon-btn">×</button></div>${content}</div></div>`}
function closeModal(){document.getElementById('modal-root').innerHTML=''}
function showSlide(n){slideIndex=(n+heroSlides.length)%heroSlides.length;const slides=document.querySelectorAll('.hero-slide');slides.forEach((el,i)=>el.classList.toggle('active',i===slideIndex));document.querySelectorAll('.slider-dot').forEach((el,i)=>el.classList.toggle('active',i===slideIndex));const title=document.getElementById('slide-title'),desc=document.getElementById('slide-desc');if(title)title.innerHTML=heroSlides[slideIndex].title;if(desc)desc.textContent=heroSlides[slideIndex].desc;}
setInterval(()=>{if(page==='home'&&!document.hidden)showSlide(slideIndex+1)},6500);
function handle(action){let [cmd,...parts]=action.split(':'),val=parts.join(':');if(cmd==='slide')return showSlide(Number(val));if(cmd==='slide-next')return showSlide(slideIndex+1);if(cmd==='slide-prev')return showSlide(slideIndex-1);if(cmd==='go')return navigate(val);if(cmd==='theme'){dark=!dark;document.documentElement.classList.toggle('dark',dark);storage.setItem('gents_theme',dark?'dark':'light');render();return}if(cmd==='menu'){document.getElementById('links').classList.toggle('open');return}if(cmd==='start-booking')return resetBooking();if(cmd==='open-branch')return navigate('branch:'+val);if(cmd==='book-branch')return resetBooking({branch:val});if(cmd==='book-service')return resetBooking({service:val});if(cmd==='book-barber'){let b=barber(val);return resetBooking({branch:b.branch,barber:val})}if(cmd==='barber-filter'){barberFilter=val;return render()}if(cmd==='gallery-filter'){galleryFilter=val;return render()}if(cmd==='image'){return modal('Gallery',`<img style="width:100%;border-radius:10px" src="${val}" alt="Gallery preview">`)}if(cmd==='close-modal')return closeModal();if(cmd==='join-membership'){location.href='login';return}if(cmd==='whatsapp-demo'){const w=(db.settings&&db.settings.whatsapp)||'+263 77 601 1938';window.open('https://wa.me/'+w.replace(/[^0-9]/g,''),'_blank');return}
if(cmd==='book-choose-branch'){booking.branch=val;booking.barber='';if(booking.service&&!service(booking.service).branches.includes(val))booking.service='';booking.date='';booking.time='';return render()}if(cmd==='book-choose-service'){booking.service=val;booking.barber='';booking.date='';booking.time='';return render()}if(cmd==='book-choose-barber'){booking.barber=val;booking.date='';booking.time='';return render()}if(cmd==='book-choose-date'){booking.date=val;booking.time='';return render()}if(cmd==='book-choose-time'){booking.time=val;return render()};if(cmd==='book-back'){bookingStep=Math.max(0,bookingStep-1);return render()}if(cmd==='book-next'){if(bookingStep===0&&!booking.branch||bookingStep===1&&!booking.service||bookingStep===2&&!booking.barber||bookingStep===3&&(!booking.date||!booking.time))return toast('Please make a selection before continuing.');if(bookingStep===4){booking.name=document.getElementById('bk-name').value.trim();booking.phone=document.getElementById('bk-phone').value.trim();booking.email=document.getElementById('bk-email').value.trim();booking.notes=document.getElementById('bk-notes').value.trim();if(!booking.name||!booking.phone||!/^\S+@\S+\.\S+$/.test(booking.email))return toast('Please enter a name, phone number and valid email.')}bookingStep++;return render()}
if(cmd==='book-submit'){const assigned=booking.barber==='any'?(db.barbers.find(x=>x.branch===booking.branch&&x.services.includes(booking.service))||{}).id:booking.barber;if(!assigned)return toast('No available barber for this selection.');if(db.bookings.some(x=>x.branch===booking.branch&&x.barber===assigned&&x.date===booking.date&&x.time===booking.time&&['Pending','Confirmed'].includes(x.status)))return toast('This slot has just been taken. Please choose another.');booking.id='GT-'+(1050+db.bookings.length)+'-'+Math.random().toString(36).slice(2,6);db.bookings.push({...booking,barber:assigned,status:'Pending',source:'Online',clientCreated:true,clientEmail:clEmail()});db.notifications.unshift('New booking '+booking.id+' for '+branch(booking.branch).name);save();return navigate('confirmation')}
if(cmd==='admin-tab'){dashboardTab=val;return render()}if(cmd==='client-tab'){clientTab=val;return render()}if(cmd==='client-side'){if(val==='membership')return navigate('membership');if(val==='profile')return toast('Demo profile: T. Moyo. Changes to profile are not enabled in this prototype.');return render()}
if(cmd==='approve'||cmd==='decline'||cmd==='client-cancel'){let b=db.bookings.find(x=>x.id===val);if(!b)return;if(cmd==='client-cancel'&&!confirm('Cancel this booking in the demo?'))return;b.status=cmd==='approve'?'Confirmed':cmd==='decline'?'Declined':'Cancelled';db.notifications.unshift(`Booking ${b.id} ${b.status}. Email and WhatsApp confirmation simulated.`);save();toast(`Booking ${b.id} ${b.status.toLowerCase()}. Email and WhatsApp notices simulated.`);return render()}
if(cmd==='view-booking'){let b=db.bookings.find(x=>x.id===val);return modal('Appointment '+esc(val),[['Customer',b.name],['Branch',branch(b.branch).name],['Service',service(b.service).name],['Barber',barber(b.barber).name],['Date & time',fmt(b.date)+' · '+b.time],['Status',b.status]].map(([k,v])=>`<div class="data-line"><span class="muted">${k}</span><b>${esc(v)}</b></div>`).join('')+(b.status==='Pending'?`<div class="auth-actions" style="margin-top:20px"><button class="btn btn-gold" data-action="approve:${b.id}">Approve</button><button class="btn" data-action="decline:${b.id}">Decline</button></div>`:''))}
if(cmd==='rebook'){let b=db.bookings.find(x=>x.id===val);return resetBooking({branch:b.branch,service:b.service,barber:b.barber})}
if(cmd==='walkin')return modal('Register Walk-in',`<form id="walkin-form"><div class="form-group"><label class="form-label">Client name</label><input name="name" required class="field" placeholder="Customer name"></div><div class="form-group"><label class="form-label">Branch</label><select name="branch" required class="field">${db.branches.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div><div class="form-group"><label class="form-label">Service</label><select name="service" required class="field">${db.services.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div><div class="form-group"><label class="form-label">Date & time</label><input type="date" name="date" class="field" required min="${dateOffset(0)}" value="${dateOffset(1)}"><select name="time" class="field" style="margin-top:9px">${['09:00','10:00','11:00','12:00','13:00','14:00','15:00'].map(x=>`<option>${x}</option>`).join('')}</select></div><button class="btn btn-gold" type="submit">Register Walk-in</button></form>`)
if(cmd==='add-branch')return modal('Add Branch',`<form id="branch-form"><div class="form-group"><label class="form-label">Branch name</label><input name="name" required class="field" placeholder="New location"></div><div class="form-group"><label class="form-label">Address</label><input name="place" required class="field" placeholder="Location, city"></div><button class="btn btn-gold">Add Demo Branch</button></form>`)
if(cmd==='add-barber')return modal('Add Barber',`<form id="barber-form"><div class="form-group"><label class="form-label">Name</label><input name="name" required class="field" placeholder="Barber name"></div><div class="form-group"><label class="form-label">Branch</label><select name="branch" class="field">${db.branches.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div><button class="btn btn-gold">Add Demo Barber</button></form>`)
if(cmd==='add-service')return modal('Add Service',`<form id="service-form"><div class="form-group"><label class="form-label">Service name</label><input class="field" required name="name"></div><div class="form-group"><label class="form-label">Price (USD)</label><input class="field" type="number" min="0" required name="price"></div><div class="form-group"><label class="form-label">Duration (minutes)</label><input class="field" type="number" min="5" required name="duration" value="30"></div><button class="btn btn-gold">Add Service</button></form>`)
if(cmd==='edit-service'){let x=service(val);return modal('Edit Service',`<form id="edit-service-form"><input type="hidden" name="id" value="${esc(x.id)}"><div class="form-group"><label class="form-label">Name</label><input class="field" required name="name" value="${esc(x.name)}"></div><div class="form-group"><label class="form-label">Price</label><input class="field" type="number" min="0" required name="price" value="${x.price}"></div><button class="btn btn-gold">Save Changes</button></form>`)}
if(cmd==='reset'){if(!confirm('Reset all demo data, bookings and changes?'))return;fetch('api/db.php',{method:'POST',headers:{'Content-Type':'application/json'},body:'{"__reset":true}',credentials:'same-origin'}).then(r=>r.json()).then(j=>{if(j&&j.ok){storage.removeItem(KEY);location.reload()}else toast('Reset failed — server did not confirm.')}).catch(()=>toast('Reset failed — could not reach server.'));return}
}
document.addEventListener('click',e=>{let el=e.target.closest('[data-action],[data-page]');if(!el)return;if(el.dataset.action){e.preventDefault();handle(el.dataset.action)}else if(el.dataset.page){e.preventDefault();navigate(el.dataset.page)}});
document.addEventListener('change',e=>{if(e.target.id==='admin-branch'){branchFilter=e.target.value;render()}});
document.addEventListener('submit',e=>{let form=e.target;if(!['contact-form','walkin-form','branch-form','barber-form','service-form','edit-service-form'].includes(form.id))return;e.preventDefault();let v=Object.fromEntries(new FormData(form));if(form.id==='contact-form'){db.contacts.push(v);save();form.reset();return toast('Message saved locally. Branch email notification simulated.')}if(form.id==='walkin-form'){let b=db.barbers.find(x=>x.branch===v.branch&&x.services.includes(v.service));if(!b)return toast('No eligible barber found in this branch.');if(db.bookings.some(x=>x.branch===v.branch&&x.barber===b.id&&x.date===v.date&&x.time===v.time&&['Pending','Confirmed'].includes(x.status)))return toast('This appointment conflicts with an existing booking.');db.bookings.push({id:'GT-'+(1050+db.bookings.length)+'-'+Math.random().toString(36).slice(2,6),name:v.name,phone:'Walk-in',email:'—',branch:v.branch,service:v.service,barber:b.id,date:v.date,time:v.time,status:'Confirmed',source:'Walk-in'});toast('Walk-in registered and calendar updated.')}if(form.id==='branch-form'){let id=v.name.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'-'+Date.now().toString().slice(-4);db.branches.push({id,name:v.name,place:v.place,photo:IM.salon,hours:'Mon–Sat · 09:00–18:00'});toast('New branch created.')}if(form.id==='barber-form'){db.barbers.push({id:'barber'+Date.now(),name:v.name,branch:v.branch,role:'Barber',photo:IM.barber1,services:db.services.map(x=>x.id)});toast('Barber added to the team.')}if(form.id==='service-form'){db.services.push({id:'srv'+Date.now(),name:v.name,desc:'Grooming service',icon:'✂',duration:Number(v.duration),price:Number(v.price),branches:db.branches.map(x=>x.id)});toast('Service added.')}if(form.id==='edit-service-form'){let s=service(v.id);s.name=v.name;s.price=Number(v.price);toast('Service updated.')}save();closeModal();render()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
async function verifySession(){if(!/^https?:$/.test(location.protocol))return true;let a=null;try{a=sessionStorage.getItem('gents_auth')}catch(e){}if(a!=='admin'&&a!=='client')return true;try{const r=await fetch('api/auth.php',{credentials:'same-origin'});if(r.status===401){try{sessionStorage.removeItem('gents_auth');sessionStorage.removeItem('gents_staff');sessionStorage.removeItem('gents_client')}catch(e){}if(page==='admin'){toast('Session expired — please sign in again.');location.href='login'}else if(page==='client'){location.href='login'}return false}return true}catch(e){return true}}
async function bootRender(){const prot=(page==='admin'||page==='client');let a=null;try{a=sessionStorage.getItem('gents_auth')}catch(e){}const vs=verifySession();if(prot&&a){if(!await vs)return}try{await remoteReady}catch(e){}render()}
bootRender();
})();
</script>
